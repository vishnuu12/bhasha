name: Web and Android checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Deployed HTTPS backend origin for the debug APK; never include a secret'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Export Android frontend
        env:
          # PR builds validate packaging only. Manual builds use a real backend.
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || vars.MOBILE_API_BASE_URL || 'https://backend.example.invalid' }}
        run: pnpm build:mobile
      - run: pnpm cap:sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and lint Android
        working-directory: android
        run: bash gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mozhi-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
